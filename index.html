  const S = crypto.subtle, enc = new TextEncoder();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  async function open(K) {
    const key = await S.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await S.decrypt({ name: 'AES-GCM', iv: ub(IV) }, key, ub(DATA)));

  async function unwrap(pw) {
    const base = await S.importKey('raw', enc.encode(pw.normalize('NFC').trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);

    return null;
  }
