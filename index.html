  const S = crypto.subtle, enc = new TextEncoder();
  const ub = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  async function open(K) {
    const key = await S.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
    const html = new TextDecoder().decode(await S.decrypt({ name: 'AES-GCM', iv: ub(IV) }, key, ub(DATA)));
    try { localStorage.setItem('targetai.key', JSON.stringify({ v: V, k: btoa(String.fromCharCode(...K)) })); } catch (e) {}

  async function unwrap(pw) {
    const base = await S.importKey('raw', enc.encode(pw.normalize('NFC').trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);

      const wk = await S.deriveKey({ name: 'PBKDF2', salt: ub(s.s), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
